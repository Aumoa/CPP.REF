name: Check Compile Errors

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, windows-latest, macos-latest]
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Setup Script (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./Setup.sh
          ./Setup.sh

      - name: Build AylaBuildTool (Windows)
        if: runner.os == 'Windows'
        run: dotnet publish ./Engine/Source/Programs/AylaBuildTool/AylaBuildTool.csproj -c Shipping -o ./Engine/Binaries/DotNET

      - name: Build
        run: dotnet ./Engine/Binaries/DotNET/AylaBuildTool.dll build --target "Engine" --config Shipping --skip-shaders
