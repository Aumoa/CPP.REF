name: Check Compile Errors

on:
  push:
    branches:
      - dev
      - copilot/fix-macos-build-issues

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Setup Script (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./Setup.sh
          ./Setup.sh

      - name: Run Setup Script (Windows)
        if: runner.os == 'Windows'
        run: |
          dir "C:\Program Files\Microsoft Visual Studio\2022"
          ./Setup.bat

      - name: Build
        run: dotnet ./Engine/Binaries/DotNET/AylaBuildTool.dll build --target "Engine" --config Shipping